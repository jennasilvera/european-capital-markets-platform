[project]
name = "european-capital-markets-platform"
version = "0.1.0"
description = "European Capital Markets Issuance & Execution Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "psycopg[binary]>=3.3.5,<3.4",
    "sqlalchemy>=2.0.54,<2.1",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "alembic>=1.20,<1.21",
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.uv.build-backend]
module-name = "european_capital_markets"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]
